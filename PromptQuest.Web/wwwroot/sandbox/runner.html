<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>PromptQuest runner</title>
<style>
  /* Общий "фирменный" стиль сцены — не зависит от уровня, поэтому не дублируется
     в levels.json. Задаёт форму/слой лягушки и кувшинки, чтобы лягушка была всегда
     видна поверх кувшинки и чтобы их нельзя было спутать. Порядок в каскаде:
     этот блок -> #base-css (сцена уровня) -> #player-code (код игрока).
     html/body без отступов и с overflow:hidden — сцена уровня фиксированного
     размера не должна создавать скролл внутри sandbox-iframe. */
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  .frog {
    position: relative;
    z-index: 2;
    border-radius: 50%;
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.35);
  }
  .frog::before,
  .frog::after {
    content: "";
    position: absolute;
    top: 24%;
    width: 16%;
    height: 16%;
    background: #fff;
    border-radius: 50%;
    box-shadow: inset 0 0 0 2px rgba(0, 0, 0, 0.45);
  }
  .frog::before {
    left: 18%;
  }
  .frog::after {
    right: 18%;
  }
  .lily {
    position: absolute;
    z-index: 1;
    border-radius: 50%;
    background: #2f8f4e; /* запасной цвет — если уровень не задал свой, кувшинка не пропадает */
    box-shadow: inset 0 0 0 3px rgba(0, 0, 0, 0.18);
  }
</style>
<style id="base-css"></style>
</head>
<body>
<div id="scene-root"></div>
<script src="runner.js"></script>
</body>
</html>
